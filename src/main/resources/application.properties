# ===============================
# FIX FOR TIDB CLOUD CONNECTION DROPS
# ===============================

# 1. Give TiDB a full 30 seconds to wake up from a cold start
spring.datasource.hikari.connection-timeout=30000

# 2. Maximum time a connection lives (10 minutes - safely under TiDB's 15 min limit)
spring.datasource.hikari.max-lifetime=600000

# 3. How long a connection can sit idle before being retired (8 minutes)
spring.datasource.hikari.idle-timeout=480000

# 4. Keep at least 1 active connection open so the keep-alive ping actually fires
spring.datasource.hikari.minimum-idle=1

# 5. Ping the database every 4 minutes to prevent it from going to sleep
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.connection-test-query=SELECT 1